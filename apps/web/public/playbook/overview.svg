<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="overview instructional diagram"><rect width="900" height="300" rx="12" fill="#F4F7FC"/><rect x="20" y="75" width="205" height="145" rx="7" fill="#E2EAF9"/><text x="33" y="125" font-family="Segoe UI,Arial" font-size="24" fill="#214FB2" font-weight="600">MARK</text><text x="33" y="173" font-family="Segoe UI,Arial" font-size="18" fill="#18324D" font-weight="600">Draw the range</text><rect x="243" y="75" width="205" height="145" rx="7" fill="#E2EAF9"/><text x="256" y="125" font-family="Segoe UI,Arial" font-size="24" fill="#214FB2" font-weight="600">BREAK</text><text x="256" y="173" font-family="Segoe UI,Arial" font-size="18" fill="#18324D" font-weight="600">5m close outside</text><rect x="466" y="75" width="205" height="145" rx="7" fill="#E2EAF9"/><text x="479" y="125" font-family="Segoe UI,Arial" font-size="24" fill="#214FB2" font-weight="600">RETEST</text><text x="479" y="173" font-family="Segoe UI,Arial" font-size="18" fill="#18324D" font-weight="600">Later 1m trigger</text><rect x="689" y="75" width="205" height="145" rx="7" fill="#E2EAF9"/><text x="702" y="125" font-family="Segoe UI,Arial" font-size="24" fill="#214FB2" font-weight="600">EXECUTE</text><text x="702" y="173" font-family="Segoe UI,Arial" font-size="18" fill="#18324D" font-weight="600">Risk, entry, exit</text><text x="40" y="270" font-family="Segoe UI,Arial" font-size="20" fill="#18324D" font-weight="600">A wick is not a close. A break is not an entry. No retest = no trade.</text></svg>