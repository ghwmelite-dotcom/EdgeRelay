<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="55%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#1b2740" stroke-width="1"/>

  <!-- Ambient glows -->
  <circle cx="950" cy="160" r="260" fill="url(#glowCyan)"/>
  <circle cx="1130" cy="290" r="200" fill="url(#glowGreen)"/>
  <circle cx="180" cy="270" r="180" fill="url(#glowCyan)" opacity="0.5"/>

  <!-- Faint grid -->
  <g stroke="#16223c" stroke-width="1" opacity="0.55">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Logo mark: relay arcs + bolt -->
  <g transform="translate(64,88)">
    <circle cx="72" cy="72" r="66" fill="#05080d" stroke="url(#brandV)" stroke-width="2.5"/>
    <circle cx="72" cy="72" r="54" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.18"/>
    <path d="M 100 42 A 38 38 0 0 1 100 102" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.4"/>
    <path d="M 110 52 A 28 28 0 0 1 110 92" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.25"/>
    <path d="M 78 40 L 96 40 L 84 62 L 100 62 L 70 96 L 78 68 L 64 68 Z" fill="url(#brandV)"/>
  </g>

  <!-- Wordmark -->
  <text x="230" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="64" letter-spacing="1" fill="url(#brand)">EdgeRelay</text>
  <text x="233" y="182" font-family="'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="21" fill="#9fb3d1">Edge-native trade signal copier for MT5 — the VPS killer</text>

  <!-- Chips -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#7f95b5">
    <rect x="232" y="208" width="148" height="28" rx="14" fill="#0e1830" stroke="#1e2f52" stroke-width="1"/>
    <text x="256" y="227">Cloudflare Workers</text>
    <rect x="392" y="208" width="122" height="28" rx="14" fill="#0e1830" stroke="#1e2f52" stroke-width="1"/>
    <text x="416" y="227">Durable Objects</text>
    <rect x="526" y="208" width="98" height="28" rx="14" fill="#0e1830" stroke="#1e2f52" stroke-width="1"/>
    <text x="550" y="227">D1 + KV + R2</text>
    <rect x="636" y="208" width="76" height="28" rx="14" fill="#0e1830" stroke="#1e2f52" stroke-width="1"/>
    <text x="660" y="227">MQL5 EA</text>
  </g>

  <!-- Right-side illustration: master node relaying to followers across the edge -->
  <g>
    <!-- Concentric edge arcs -->
    <path d="M 960 40 A 130 130 0 0 1 960 280" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.35"/>
    <path d="M 990 70 A 95 95 0 0 1 990 250" fill="none" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.22"/>
    <path d="M 1015 98 A 62 62 0 0 1 1015 222" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.14"/>

    <!-- Relay paths master -> followers -->
    <path d="M 888 160 C 940 100 990 84 1036 76" fill="none" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M 896 160 L 1044 160" fill="none" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M 888 160 C 940 220 990 236 1036 244" fill="none" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.85"/>

    <!-- Signal pulses along paths -->
    <circle cx="948" cy="108" r="4" fill="#00e5ff" filter="url(#soft)"/>
    <circle cx="980" cy="160" r="4" fill="#00ff9d" filter="url(#soft)"/>
    <circle cx="948" cy="212" r="4" fill="#00e5ff" filter="url(#soft)"/>

    <!-- Master node -->
    <rect x="806" y="128" width="84" height="64" rx="12" fill="#0b1428" stroke="url(#brand)" stroke-width="2"/>
    <rect x="822" y="146" width="8" height="22" rx="2" fill="#00ff9d"/>
    <rect x="836" y="154" width="8" height="14" rx="2" fill="#00e5ff"/>
    <rect x="850" y="140" width="8" height="28" rx="2" fill="#00ff9d" opacity="0.8"/>
    <text x="848" y="118" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8fa6c8">MASTER</text>

    <!-- Follower nodes -->
    <g>
      <rect x="1040" y="52" width="72" height="48" rx="10" fill="#0b1428" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="1058" cy="76" r="5" fill="#00ff9d"/>
      <rect x="1070" y="70" width="30" height="4" rx="2" fill="#28405f"/>
      <rect x="1070" y="80" width="20" height="4" rx="2" fill="#28405f"/>
    </g>
    <g>
      <rect x="1048" y="136" width="72" height="48" rx="10" fill="#0b1428" stroke="#00ff9d" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="1066" cy="160" r="5" fill="#00e5ff"/>
      <rect x="1078" y="154" width="30" height="4" rx="2" fill="#28405f"/>
      <rect x="1078" y="164" width="20" height="4" rx="2" fill="#28405f"/>
    </g>
    <g>
      <rect x="1040" y="220" width="72" height="48" rx="10" fill="#0b1428" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="1058" cy="244" r="5" fill="#00ff9d"/>
      <rect x="1070" y="238" width="30" height="4" rx="2" fill="#28405f"/>
      <rect x="1070" y="248" width="20" height="4" rx="2" fill="#28405f"/>
    </g>
    <text x="1080" y="292" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8fa6c8">FOLLOWERS × N</text>
  </g>

  <!-- Bottom hairline -->
  <line x1="64" y1="272" x2="720" y2="272" stroke="#16223c" stroke-width="1"/>
  <text x="64" y="296" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#5f7396">Sub-10ms signal propagation across 300+ Cloudflare PoPs — no VPS, no latency tax.</text>
</svg>
